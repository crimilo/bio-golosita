<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Banner Facebook — miele, titolo grande</title>
<!--
  Banner Facebook 1080×1350 (4:5). Qui comanda la **frase**: l'occhiello in
  Caveat, il titolo in Fraunces grande su due righe, una riga di spiegazione, e
  sotto una sola foto — il favo, che è un primo piano e regge la striscia larga
  meglio di un barattolo (un barattolo in 960×620 si taglierebbe sopra e sotto).

  È il disegno più tipografico dei sei: nessuna disposizione da leggere, solo
  l'ordine con cui si legge. Nessun velo, nessun testo sopra la foto, niente
  prezzi né badge.
-->
<style>
  @font-face { font-family:'Fraunces'; font-style:normal; font-weight:700; font-display:block; src:url('public/fonts/fraunces-700-latin.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:block; src:url('public/fonts/inter-400-latin.woff2') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:block; src:url('public/fonts/inter-700-latin.woff2') format('woff2'); }
  @font-face { font-family:'Caveat'; font-style:normal; font-weight:500; font-display:block; src:url('public/fonts/caveat-500-latin.woff2') format('woff2'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body { font-family:'Inter', system-ui, sans-serif; color:#33240f; background:#fffbf2; }

  .frame { position:relative; width:1080px; height:1350px; overflow:hidden; display:flex; flex-direction:column; background:#fffbf2; }

  /* ── testata ───────────────────────────────────────────────────────────── */
  .head { flex:none; padding:44px 56px 0; }
  .brand { display:flex; align-items:center; gap:18px; }
  .brand .mark { display:block; width:76px; height:76px; flex:none; }
  .brand-name { display:block; font-family:'Fraunces', serif; font-weight:700; font-size:40px; line-height:1; color:#33240f; }
  .brand-sub { display:block; font-family:'Caveat', cursive; font-weight:500; font-size:28px; line-height:1; color:#9a6200; margin-top:4px; }

  /* ── il titolo ─────────────────────────────────────────────────────────── */
  .text { flex:none; padding:40px 70px 0; text-align:center; }
  .eyebrow { display:block; font-family:'Caveat', cursive; font-weight:500; font-size:42px; line-height:1; color:#9a6200; }
  .title { margin-top:6px; font-family:'Fraunces', serif; font-weight:700; font-size:64px; line-height:1.06; letter-spacing:-0.015em; color:#33240f; }
  .sub { margin-top:16px; font-size:25px; font-weight:400; line-height:1.4; color:#6b5638; }

  /* ── la striscia: il favo, nessun velo ─────────────────────────────────── */
  .photo { flex:none; margin:32px 60px 0; }
  .photo img { display:block; width:960px; height:620px; object-fit:cover; border-radius:20px; }

  /* ── la CTA ────────────────────────────────────────────────────────────── */
  .cta { flex:none; margin-top:auto; margin-bottom:46px; padding:0 56px; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .pill {
    display:inline-flex; align-items:center; gap:18px; white-space:nowrap;
    background:#0e8446; color:#fff; border-radius:999px;
    padding:26px 48px; font-size:42px; font-weight:700; line-height:1;
    box-shadow:0 12px 30px rgba(14,132,70,0.32);
  }
  .pill svg { width:1.05em; height:1.05em; flex:none; }
  .num { font-family:'Fraunces', serif; font-weight:700; font-size:52px; line-height:1; letter-spacing:-0.01em; white-space:nowrap; color:#33240f; }
  .domain { font-size:24px; font-weight:700; line-height:1.2; letter-spacing:0.04em; color:#6b5638; }
</style>
</head>
<body>
  <div class="frame">
    <div class="head">
      <div class="brand">
        <img class="mark" src="public/logo.svg" alt="">
        <div class="brand-text">
          <span class="brand-name">Bio &amp; Golosità</span>
          <span class="brand-sub">miele dal 2020</span>
        </div>
      </div>
    </div>

    <div class="text">
      <span class="eyebrow">100% italiano · di api proprie</span>
      <h1 class="title">Miele artigianale, direttamente dall'apicoltore</h1>
      <p class="sub">Dai nostri apiari: non pastorizzato.</p>
    </div>

    <figure class="photo">
      <img data-photo="miele-in-favo.jpg" src="miele-in-favo.jpg" alt="Miele in favo" style="object-position:50.00% 0.00%">
    </figure>

    <div class="cta">
      <span class="pill">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Scrivici su WhatsApp
      </span>
      <div class="num">+39 351 537 6719</div>
      <div class="domain">bioegolosita.it</div>
    </div>
  </div>
</body>
</html>
